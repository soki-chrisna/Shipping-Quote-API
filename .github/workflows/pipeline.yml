name: Test, publish, deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Check deployment script syntax
        run: bash -n scripts/deploy.sh

      - name: Build and smoke test container
        run: |
          docker build -t shipping-quote:test .
          docker run -d \
            --name smoke \
            -p 127.0.0.1:3000:3000 \
            -e API_KEY=ci-only-key-with-at-least-32-characters \
            shipping-quote:test
          trap 'docker logs smoke; docker rm -f smoke' EXIT

          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/healthz
          curl --fail --silent http://127.0.0.1:3000/v1/quotes \
            -H 'Authorization: Bearer ci-only-key-with-at-least-32-characters' \
            -H 'Content-Type: application/json' -d '{"zone":"domestic","weightGrams":1500}' \
            | node scripts/verify-quote-response.js

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish immutable image reference
        id: image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$GITHUB_SHA" \
            .
          docker push "$IMAGE:$GITHUB_SHA"
          docker pull "$IMAGE:$GITHUB_SHA"
          REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          echo "image=$REF" >> "$GITHUB_OUTPUT"

  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    needs: publish
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Deploy with verified SSH host key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s -- '$IMAGE'" < scripts/deploy.sh
